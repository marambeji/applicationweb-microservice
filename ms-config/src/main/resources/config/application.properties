# Configuration commune à tous les MS
spring.cloud.config.enabled=true
eureka.client.serviceUrl.defaultZone=http://eureka-server:8761/eureka/
# Security configuration
# On garde localhost pour l'issuer car c'est ce que le browser envoie
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8088/realms/MedicalSync
# On utilise le nom du container pour récupérer les clés (inter-container)
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://keycloak:8080/realms/MedicalSync/protocol/openid-connect/certs
