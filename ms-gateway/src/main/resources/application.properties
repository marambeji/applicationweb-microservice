server.port=8089
spring.application.name=ms-gateway

# Eureka Configuration
# Keycloak Security
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8088/realms/MedicalSync
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8088/realms/MedicalSync/protocol/openid-connect/certs

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Dynamic Routes via Eureka (LoadBalancer)
# Every request to localhost:8089/api/... is routed to the corresponding microservice

# 1. User
spring.cloud.gateway.routes[0].id=ms-user
spring.cloud.gateway.routes[0].uri=lb://MS-USER
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/users/**

# 2. Location Matériel
spring.cloud.gateway.routes[1].id=ms-location-materiel
spring.cloud.gateway.routes[1].uri=lb://MS-LOCATION-MATERIEL
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/location-materiel/**

# 3. Pharmacie
spring.cloud.gateway.routes[2].id=ms-pharmacie
spring.cloud.gateway.routes[2].uri=lb://MS-PHARMACIE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/pharmacie/**

# 4. Don de Sang
spring.cloud.gateway.routes[3].id=ms-don-de-sang
spring.cloud.gateway.routes[3].uri=lb://MS-DON-DE-SANG
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/don-de-sang/**

# 5. Rendez-vous
spring.cloud.gateway.routes[4].id=ms-rendez-vous
spring.cloud.gateway.routes[4].uri=lb://MS-RENDEZ-VOUS
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/rendez-vous/**

# 6. Réclamation (optionnel si c'est un autre langage, mais formaté correctement)
spring.cloud.gateway.routes[5].id=ms-reclamation
spring.cloud.gateway.routes[5].uri=lb://MS-RECLAMATION
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/reclamations/**
